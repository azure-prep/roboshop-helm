appName: shipping
port: 8080
serviceType: ClusterIP
configMap:
  CART_ENDPOINT: cart:8080
  DB_HOST: mysql-dev.azdevopsb1.online
  DB_USER: root
  DB_PASS: RoboShop@1
  DB_TYPE: mysql
  APP_GIT_URL: https://github.com/roboshop-devops-project-v3/shipping

minReplicas: 3
db_job:
  ext: sql
  enabled: true
  initJobs:
    - app-user
    - schema
  jobs:
    - master-data

resources:
  requests:
    memory: "3100Mi"
    cpu: "1000m"
  limits:
    memory: "4000Mi"
    cpu: "1200m"


probes:
  liveness:
    initialDelaySeconds: 60
  readiness:
    initialDelaySeconds: 60